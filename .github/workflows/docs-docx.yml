name: Build DOCX notes

on:
  push:
    branches: [main]
    paths:
      - "docs/learn-claude-code-notes.md"
      - ".github/build_course_docx.py"
      - ".github/workflows/docs-docx.yml"
  pull_request:
    paths:
      - "docs/learn-claude-code-notes.md"
      - ".github/build_course_docx.py"
      - ".github/workflows/docs-docx.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-docx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DOCX dependency
        run: python -m pip install --disable-pip-version-check "python-docx>=1.1,<2"

      - name: Generate Word reading copy
        run: python .github/build_course_docx.py

      - name: Commit generated DOCX when changed
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -euo pipefail
          target="docx/QianAgent-Learn-Claude-Code-Notes.docx"
          if [[ -z "$(git status --porcelain -- "$target")" ]]; then
            echo "DOCX is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git commit -m "docs: refresh generated DOCX notes"
          git push origin "HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"

# PR runs materialize the binary before merge; main pushes keep the checked-in Word copy in sync.
# This branch intentionally exercises that PR materialization path before the binary is merged.
