name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Runtime regression suite
        run: python -m unittest discover -v
      - name: Legacy step regressions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r test_file; do
            echo "=== $test_file ==="
            python "$test_file"
          done < <(find steps -maxdepth 2 -type f -name 'test*.py' | sort)
      - name: Compile smoke test
        run: python -m compileall -q qian tests steps
