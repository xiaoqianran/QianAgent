[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qian-agent"
version = "0.6.0"
description = "QianAgent — 从零分步搭建的 coding agent（Step 01-18）"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
qian = "qian.__main__:main"

[tool.setuptools.packages.find]
include = ["qian*"]
